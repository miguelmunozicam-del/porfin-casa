<style>
/* Layout: app de una columna (máx. 720 px), mobile-first, con barra fija inferior (botón principal + navegación) en la zona del pulgar. */
:root{
  --fondo:#FFFFFF; --superficie:#F5F6FA; --linea:#E1E4EC; --texto:#1A1A1A; --texto-suave:#5B6275;
  --rojo:#C8102E; --rojo-hover:#B01E2D; --sobre-rojo:#FFFFFF; --azul:#1C2C5B; --sobre-azul:#FFFFFF;
  --ok:#1E7B3A; --aviso:#8F5A00; --error:#C8102E;
  --ok-fondo:#E7F3EA; --aviso-fondo:#FBF1DE; --error-fondo:#FBE7EA;
  --radio:14px; --sombra:0 2px 8px rgba(0,0,0,.08);
  --fuente:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fondo:#121418; --superficie:#1E2128; --linea:#2C313B; --texto:#E8EAF0; --texto-suave:#A3A9B8;
  --rojo:#FF6B6B; --rojo-hover:#FF8A80; --sobre-rojo:#121418; --azul:#8EA2E8; --sobre-azul:#121418;
  --ok:#4CC77A; --aviso:#F2B84B; --error:#FF6B6B;
  --ok-fondo:#17301F; --aviso-fondo:#33290F; --error-fondo:#3A1A1D; --sombra:0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fondo:#121418; --superficie:#1E2128; --linea:#2C313B; --texto:#E8EAF0; --texto-suave:#A3A9B8;
  --rojo:#FF6B6B; --rojo-hover:#FF8A80; --sobre-rojo:#121418; --azul:#8EA2E8; --sobre-azul:#121418;
  --ok:#4CC77A; --aviso:#F2B84B; --error:#FF6B6B;
  --ok-fondo:#17301F; --aviso-fondo:#33290F; --error-fondo:#3A1A1D; --sombra:0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--fondo)}
body{color:var(--texto);font-family:var(--fuente);font-size:16px;line-height:1.5;margin:0}
.franja{height:6px;background:repeating-linear-gradient(90deg,var(--rojo) 0 18px,var(--fondo) 18px 36px);border-bottom:2px solid var(--azul)}
main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 180px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance;color:var(--azul)}
h1{font-size:24px}h2{font-size:18px}h3{font-size:16px}
p{margin:0}
.suave{color:var(--texto-suave);font-size:14px}
.num{font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:12px}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tarjeta{background:var(--superficie);border-radius:var(--radio);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.marcador{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.cifra{font-size:40px;font-weight:800;line-height:1;color:var(--azul);font-variant-numeric:tabular-nums}
.premio{border:2px solid var(--azul);border-radius:var(--radio);padding:12px 16px;display:flex;gap:12px;align-items:center}
.premio b{color:var(--azul)}
.aviso-banda{border-radius:var(--radio);padding:12px 16px;background:var(--aviso-fondo);color:var(--texto)}
.aviso-banda strong{color:var(--aviso)}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fila>*{min-width:0}
.entre{display:flex;justify-content:space-between;gap:12px;align-items:center}
.lista{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{background:var(--superficie);border-radius:var(--radio);padding:12px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item .t{font-weight:600}
.pts{font-weight:800;color:var(--azul);font-variant-numeric:tabular-nums;white-space:nowrap}
button,.boton{font:inherit;font-size:16px;min-height:44px;border-radius:var(--radio);border:2px solid transparent;padding:8px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.b-prin{background:var(--rojo);color:var(--sobre-rojo);min-height:52px;width:100%}
.b-prin:hover{background:var(--rojo-hover)}
.b-sec{background:transparent;color:var(--azul);border-color:var(--azul)}
.b-ok{background:var(--ok);color:var(--fondo);flex:1}
.b-no{background:transparent;color:var(--error);border-color:var(--error);flex:1}
.b-peligro{background:var(--error);color:var(--sobre-rojo)}
.b-texto{background:transparent;color:var(--azul);padding:8px;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.chip:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
button[disabled]{opacity:.5;cursor:not-allowed}
.estado{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.e-ok{background:var(--ok-fondo);color:var(--ok)}
.e-pend{background:var(--aviso-fondo);color:var(--aviso)}
.e-no{background:var(--error-fondo);color:var(--error)}
.barra{height:8px;background:var(--linea);border-radius:99px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--azul);border-radius:99px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--linea);background:var(--fondo);color:var(--texto);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--azul);background:var(--azul);color:var(--sobre-azul)}
.tarea-btn{width:100%;justify-content:space-between;text-align:left;background:var(--superficie);color:var(--texto);min-height:56px;font-weight:500}
.tarea-btn:hover{border-color:var(--azul)}
.tarea-btn small{display:block;color:var(--texto-suave);font-size:14px;font-weight:400}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
input,select,textarea{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border-radius:10px;border:2px solid var(--linea);background:var(--fondo);color:var(--texto);width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:22px;min-height:22px;height:22px;accent-color:var(--azul);flex:none}
.check{flex-direction:row;align-items:center;gap:10px;font-weight:500;font-size:16px;min-height:44px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.motivos{display:flex;flex-direction:column;gap:4px;border:0;margin:0;padding:0}
.motivos legend{font-weight:600;margin-bottom:4px}
.error-txt{color:var(--error);font-size:14px;font-weight:600}
details{background:var(--superficie);border-radius:var(--radio)}
details>summary{cursor:pointer;padding:14px 16px;min-height:44px;font-weight:700;color:var(--azul);list-style-position:inside}
details>.cuerpo{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ranking-pos{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--azul);color:var(--sobre-azul);font-weight:800;flex:none}
.desglose{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.desglose dt{color:var(--texto-suave)}
.desglose dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pos{color:var(--ok)}.neg{color:var(--error)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--fondo);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.dock-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}
nav{display:grid;grid-template-columns:repeat(3,1fr)}
nav button{background:transparent;color:var(--texto-suave);flex-direction:column;gap:0;font-size:13px;min-height:52px;padding:4px}
nav button[aria-current="page"]{color:var(--azul)}
nav button[aria-current="page"] .ico{background:var(--superficie)}
nav .ico{font-size:20px;line-height:1;padding:2px 14px;border-radius:99px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--texto);color:var(--fondo);border-radius:var(--radio);padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;width:max-content;max-width:min(92vw,560px);box-shadow:var(--sombra);z-index:9}
.toast button{background:transparent;color:var(--fondo);text-decoration:underline;min-height:44px}
.demo{border:2px dashed var(--aviso);border-radius:var(--radio);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.vacio{text-align:center;padding:24px 16px;color:var(--texto-suave);display:flex;flex-direction:column;gap:8px;align-items:center}
.vacio .ico{font-size:32px}
.portada{display:flex;flex-direction:column;gap:16px;padding-top:24px}
.portada .logo{font-size:44px;font-weight:900;color:var(--rojo);line-height:1;letter-spacing:-.02em}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:13px}
@media (prefers-reduced-motion:no-preference){.toast{animation:sube .2s ease-out}@keyframes sube{from{transform:translate(-50%,12px);opacity:0}}}
.enlace{display:block;padding:10px 12px;border-radius:10px;background:var(--superficie);border:1px solid var(--linea);font-size:14px;overflow-wrap:anywhere;user-select:all}
.codigo{font-size:28px;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
body.ocupado{cursor:progress}
@media (prefers-reduced-motion:no-preference){body.ocupado .franja{animation:carga 1s linear infinite}@keyframes carga{to{background-position:36px 0}}}
</style>

<script>
/* ¡Por Fin! · v1.0 · MIT · Miguel Muñoz
   Dos modos con la misma interfaz:
   · nube  → Supabase (acceso con código por email, datos compartidos por toda la familia).
   · local → demo o casa guardada solo en este dispositivo (localStorage).
   La lógica de estados (aprobada, rechazada, silencio, sanciones) se calcula igual en ambos
   a partir de fechas y votos. En la nube, el servidor fija las horas, los puntos y quién valida. */

const CFG=Object.assign({url:'',key:''},window.PORFIN_CONFIG||{});
const KEY='porfin:v1', KPREF='porfin:prefs', H=3600e3, D=24*H;
const MOTIVOS=['No está hecha','Está a medias o mal hecha','La hizo otra persona','Duplicada (ya anotada)','Otro'];
const ESCALAS={c:['','Fácil','Requiere cuidado','Requiere habilidad o esfuerzo'],t:['','Menos de 10 min','10-30 min','Más de 30 min'],m:['','Neutra','Pesada o aburrida','Desagradable']};
const CATALOGO=[
['Cocina','Poner la mesa',1,1,1,4],['Cocina','Recoger la mesa',1,1,1],['Cocina','Cargar el lavavajillas',1,1,3],['Cocina','Vaciar el lavavajillas',1,1,3],
['Cocina','Fregar a mano (ollas, sartenes)',1,2,3],['Cocina','Cocinar comida o cena familiar',3,3,1],['Cocina','Limpiar encimera y fogones',1,2,2],
['Cocina','Limpiar el horno',2,3,3],['Cocina','Limpiar el interior de la nevera',2,2,3],
['Ropa','Poner una lavadora',1,1,3],['Ropa','Tender la ropa',1,2,2],['Ropa','Recoger y doblar la ropa',1,2,3],['Ropa','Planchar (una tanda)',2,3,3],['Ropa','Cambiar las sábanas de una cama',2,1,2],
['Limpieza','Barrer o aspirar una zona común',1,2,2],['Limpieza','Fregar el suelo de una zona común',1,2,2],['Limpieza','Quitar el polvo del salón',1,2,1],['Limpieza','Limpiar cristales y ventanas',2,3,2],['Limpieza','Ordenar el salón',1,1,1],
['Baños','Limpiar un baño completo',2,2,3],['Baños','Limpiar el inodoro',1,1,3],['Baños','Reponer papel, jabón y toallas',1,1,1],
['Basura','Bajar la basura',1,1,2],['Basura','Bajar el reciclaje (envases, papel, vidrio)',1,1,2],
['Compras','Hacer la compra semanal',2,3,1],['Compras','Compra rápida de algo que falta',1,1,1],['Compras','Colocar la compra en despensa y nevera',1,1,3],
['Mantenimiento','Pequeña reparación (bombilla, tornillo, pila)',2,1,1],['Mantenimiento','Regar las plantas',1,1,1],['Mantenimiento','Limpiar terraza o balcón',2,2,2],['Mantenimiento','Gestión doméstica (cita, recibo, trámite)',2,2,2]
];
const CATALOGO_OBJ=()=>CATALOGO.map(([cat,nombre,c,t,m,aj])=>({cat,nombre,c,t,m,ajuste:aj??null}));
const PARAMS={pC:1,pT:1,pM:1,mult:2,bonus:1,sancion:3,plazoH:24,quorum:2/3};

let S=null, modo=null, view='inicio', prefs={};
let sb=null, sesion=null, casas=[], casaId=null, canal=null, offline=false;
let ui={con:[],share:null,cat:'Todas',q:'',rech:null,rechErr:false,editT:null,borrar:false,imp:null,panelPer:null,onb:false,msg:null,login:null,cargando:false,errorCarga:null,sucio:false};

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now().toString(36));
const iso=t=>new Date(t).toISOString();
function mk(o){const t=iso(Date.now());return Object.assign({id:uid(),creado:t,modificado:t,borrado:false},o)}
function toca(o){o.modificado=iso(Date.now());return o}
const now=()=>Date.now()+((S&&S.demo&&S.demo.offset)||0)+((S&&S.skew)||0);
const vivos=a=>a.filter(x=>!x.borrado);
const inicioDia=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const finDia=t=>{const d=new Date(t);d.setHours(23,59,59,999);return d.getTime()};
const fDia=t=>new Date(t).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
const fHora=t=>new Date(t).toLocaleString('es-ES',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const aInput=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const deInput=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getTime()};
function dur(ms){ms=Math.max(0,ms);const h=Math.floor(ms/H),m=Math.floor((ms%H)/60000);if(h>=48)return Math.floor(h/24)+' días';if(h>0)return (h+' h '+(m?m+' min':'')).trim();return m+' min'}
const hace=t=>{const ms=now()-t;return ms<60000?'ahora mismo':'hace '+dur(ms)};
const fmt=n=>{n=Math.round(n*10)/10;return Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',')};
const signo=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));
const ord=n=>n+'.º';
const parts=r=>r.participantes&&r.participantes.length?r.participantes:[r.autor];
const nombres=ids=>{const n=ids.map(i=>miembro(i).nombre);return n.length>1?n.slice(0,-1).join(', ')+' y '+n[n.length-1]:(n[0]||'')};
const ptsTxt=r=>{const n=parts(r).length;return n>1?fmt(r.puntos/n)+' pts c/u':r.puntos+' pts'};
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const emailOk=e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
const urlApp=()=>location.href.split('#')[0].split('?')[0];

/* ---------- almacenamiento local ---------- */
function leer(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function escribir(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
const guardarPrefs=()=>escribir(KPREF,prefs);
function guardar(){if(modo!=='local'||!S)return;S.actualizado=iso(Date.now());if(!escribir(KEY,S))aviso('No se ha podido guardar en este navegador. Descarga una copia desde Ajustes para no perder datos.')}
function aplicarTema(){const t=prefs.tema;if(t==='oscuro')document.documentElement.dataset.theme='dark';else if(t==='claro')document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme}

/* ---------- reglas del juego ---------- */
const P=()=>S.params;
function ptsTarea(t){if(t.ajuste!==null&&t.ajuste!==''&&t.ajuste!==undefined&&!isNaN(+t.ajuste))return Math.round(+t.ajuste);const p=P();return Math.round((t.c*p.pC+t.t*p.pT+t.m*p.pM)*p.mult)}
const necesarias=(n,q)=>n?Math.max(1,Math.ceil(n*q-1e-9)):0;
function cuenta(r){let ok=0,no=0;const vence=r.fecha+r.plazoH*H;for(const id of r.validadores){const v=r.votos[id];if(v&&v.fecha<=vence)v.tipo==='ok'?ok++:no++}return{ok,no,vence,need:necesarias(r.validadores.length,r.quorum)}}
function estado(r,t=now()){const c=cuenta(r);if(!c.need)return'aprobada';if(c.ok>=c.need)return'aprobada';if(c.no>=c.need)return'rechazada';if(t>=c.vence)return'silencio';return'pendiente'}
const aprobada=e=>e==='aprobada'||e==='silencio';
function chip(e){return{aprobada:'<span class="estado e-ok">Aprobada ✓</span>',silencio:'<span class="estado e-ok">Aprobada por silencio ✓</span>',rechazada:'<span class="estado e-no">Rechazada ✕</span>',pendiente:'<span class="estado e-pend">Pendiente ⏳</span>'}[e]}

function calc(per,t=now()){
  const p=P(),m={};
  for(const x of S.miembros)m[x.id]={id:x.id,pts:0,aprob:0,ptsT:0,valid:0,sanc:0,rechazadas:0,compartidas:0,votosNo:0,causas:{},rechEmit:0,pend:0,porValidar:0};
  for(const r of vivos(S.registros).filter(r=>r.periodoId===per.id)){
    const e=estado(r,t),c=cuenta(r),ps=parts(r).map(id=>m[id]).filter(Boolean),cuota=r.puntos/parts(r).length;if(!ps.length)continue;
    for(const a of ps){if(aprobada(e)){a.aprob++;a.ptsT+=cuota;if(ps.length>1)a.compartidas++}else if(e==='rechazada')a.rechazadas++;else a.pend++}
    for(const v of r.validadores){const x=m[v];if(!x)continue;const vt=r.votos[v];
      if(vt&&vt.fecha<=c.vence){x.valid++;if(vt.tipo==='no'){x.rechEmit++;for(const a of ps){a.votosNo++;a.causas[vt.motivo]=(a.causas[vt.motivo]||0)+1}}}
      else if(t>=c.vence)x.sanc++;else x.porValidar++}
  }
  for(const k in m){const x=m[k];x.ptsT=Math.round(x.ptsT*10)/10;x.pts=Math.round((x.ptsT+x.valid*p.bonus-x.sanc*p.sancion)*10)/10}
  const lista=Object.values(m).filter(x=>{const mm=S.miembros.find(y=>y.id===x.id);return !mm.borrado||x.aprob||x.valid||x.sanc}).sort((a,b)=>b.pts-a.pts);
  lista.forEach((x,i)=>x.pos=i&&x.pts===lista[i-1].pts?lista[i-1].pos:i+1);
  return lista;
}
const miembro=id=>S.miembros.find(x=>x.id===id)||{nombre:'¿?'};
const yo=()=>miembro(S.yo);
const esAdmin=()=>!!yo().admin;
const periodoActual=()=>vivos(S.periodos).filter(p=>!p.cerrado).slice(-1)[0]||null;
const unido=m=>m.unido!==false;
const quedaValidador=con=>vivos(S.miembros).some(m=>m.id!==S.yo&&!con.includes(m.id)&&unido(m));

/* ---------- modo local: datos iniciales ---------- */
function base(casa){return{version:1,actualizado:iso(Date.now()),casa:mk({nombre:casa}),miembros:[],tareas:CATALOGO_OBJ().map(t=>mk({...t,activa:true})),params:{...PARAMS},periodos:[],registros:[],yo:null,demo:null}}
function seedDemo(){
  S=base('Casa de ejemplo');S.demo={offset:0};
  const nombresD=['Ana','Luis','Marta','Pablo'];S.miembros=nombresD.map((n,i)=>mk({nombre:n,admin:i===0}));S.yo=S.miembros[0].id;
  const t=Date.now();S.periodos=[mk({inicio:inicioDia(t-3*D),fin:finDia(t+3*D),premio:'Elegir la peli y la cena del sábado',cerrado:false})];
  const per=S.periodos[0],mid=i=>S.miembros[i].id,tarea=n=>S.tareas.find(x=>x.nombre===n);

  [0,'Limpiar un baño completo',55,{1:'ok',2:'ok',3:'Está a medias o mal hecha'}],[2,'Planchar (una tanda)',50,{0:'ok',1:'ok',3:'ok'}],
  [3,'Cocinar comida o cena familiar',45,{0:'No está hecha',1:'La hizo otra persona',2:'ok'}],[1,'Tender la ropa',40,{0:'ok',2:'ok'}],
  [0,'Hacer la compra semanal',30,{1:'ok',2:'ok',3:'ok'}],[2,'Bajar el reciclaje (envases, papel, vidrio)',26,{1:'ok',3:'ok'}],
  [3,'Ordenar el salón',20,{0:'ok',1:'Está a medias o mal hecha',2:'Está a medias o mal hecha'}],[0,'Limpiar el horno',34,{2:'ok',3:'ok'},[1]],[2,'Cambiar las sábanas de una cama',3,{},[3]],
  [1,'Vaciar el lavavajillas',6,{2:'ok'}],[2,'Limpiar encimera y fogones',2,{}],[0,'Poner una lavadora',1,{3:'ok'}]];
  for(const [a,n,h,v,con=[]] of plan){const ta=tarea(n),f=t-h*H,votos={},ps=[a,...con];
    for(const k in v)votos[mid(+k)]=v[k]==='ok'?{tipo:'ok',fecha:f+H}:{tipo:'no',motivo:v[k],fecha:f+H};
    S.registros.push(mk({tareaId:ta.id,nombre:ta.nombre,cat:ta.cat,puntos:ptsTarea(ta),autor:mid(a),fecha:f,periodoId:per.id,participantes:ps.map(mid),validadores:S.miembros.filter((_,i)=>!ps.includes(i)).map(x=>x.id),votos,plazoH:24,quorum:2/3}))}
}

/* ---------- capa de datos: local ---------- */
const reg=id=>S.registros.find(x=>x.id===id);
const fallo=m=>{throw new Error(m)};
const L={
  async anotar(tid,con){const p=periodoActual(),t=now(),ta=S.tareas.find(x=>x.id===tid);
    if(!p)fallo('No hay ningún periodo en marcha. El administrador puede crearlo en Ajustes.');
    if(t<p.inicio||t>p.fin)fallo(t>p.fin?'El periodo ya ha terminado. Pide al administrador que empiece uno nuevo.':'El periodo aún no ha empezado.');
    const c2=con.filter(id=>id!==S.yo&&vivos(S.miembros).some(m=>m.id===id)),ps=[S.yo,...c2],val=vivos(S.miembros).filter(x=>!ps.includes(x.id)).map(x=>x.id);
    if(!val.length)fallo('Tiene que quedar al menos una persona para validar. Quita a alguien de la tarea compartida.');
    const r=mk({tareaId:ta.id,nombre:ta.nombre,cat:ta.cat,puntos:ptsTarea(ta),autor:S.yo,participantes:ps,fecha:t,periodoId:p.id,validadores:val,votos:{},plazoH:P().plazoH,quorum:P().quorum});
    S.registros.push(r);guardar();return r.id},
  async votar(id,tipo,motivo){const r=reg(id);if(now()>=cuenta(r).vence)fallo('El plazo para responder ya ha terminado.');
    r.votos[S.yo]=tipo==='ok'?{tipo:'ok',fecha:now()}:{tipo:'no',motivo,fecha:now()};toca(r);guardar()},
  async retirarVoto(id){const r=reg(id);delete r.votos[S.yo];toca(r);guardar()},
  async anular(id,flag){const r=reg(id);if(flag&&Object.keys(r.votos).length)fallo('Ya hay votos en esta tarea, así que no se puede anular.');r.borrado=flag;toca(r);guardar()},
  async compartir(id,con){const r=reg(id);if(Object.keys(r.votos).length)fallo('Ya hay votos en esta tarea. Anúlala y vuelve a anotarla si quieres cambiar quién la hizo.');
    if(now()>=cuenta(r).vence)fallo('El plazo de esta tarea ya ha terminado.');
    const ps=[r.autor,...con.filter(i=>i!==r.autor)],val=vivos(S.miembros).filter(x=>!ps.includes(x.id)).map(x=>x.id);
    if(!val.length)fallo('Tiene que quedar al menos una persona para validar.');r.participantes=ps;r.validadores=val;toca(r);guardar()},
  async guardarPeriodo(o){if(o.fin<=o.inicio)fallo('Revisa las fechas: el final no puede ser anterior al inicio.');
    let per=o.id&&S.periodos.find(x=>x.id===o.id);if(!per){per=mk({cerrado:false});S.periodos.push(per)}Object.assign(per,{inicio:o.inicio,fin:o.fin,premio:o.premio});toca(per);guardar();return per.id},
  async cerrarPeriodo(id,flag){const p=S.periodos.find(x=>x.id===id);p.cerrado=flag;toca(p);guardar()},
  async guardarMiembro(o){let m;if(!o.id){if(!o.nombre)fallo('Escribe un nombre para añadir al miembro.');m=mk({nombre:o.nombre,admin:!!o.admin});S.miembros.push(m)}
    else{m=S.miembros.find(x=>x.id===o.id);const antes={...m};if(o.nombre)m.nombre=o.nombre;if(o.admin!=null)m.admin=o.admin;if(o.activo!=null)m.borrado=!o.activo;
      if(!vivos(S.miembros).some(x=>x.admin)){Object.assign(m,antes);fallo('Tiene que haber al menos un administrador.')}}
    toca(m);guardar();return m.id},
  async guardarTarea(id,d){let t;if(!id){if(!d.nombre)fallo('La tarea necesita un nombre.');t=mk({cat:'Otras',c:1,t:1,m:1,ajuste:null,activa:true,...d});S.tareas.unshift(t)}
    else{t=S.tareas.find(x=>x.id===id);Object.assign(t,d)}toca(t);guardar();return t.id},
  async importarTareas(lista){let nuevas=0,actualizadas=0;for(const d of lista){const ex=vivos(S.tareas).find(x=>norm(x.nombre)===norm(d.nombre));
      if(ex){Object.assign(ex,d,{nombre:ex.nombre});toca(ex);actualizadas++}else{S.tareas.push(mk({activa:true,...d}));nuevas++}}guardar();return{nuevas,actualizadas}},
  async guardarReglas(p){Object.assign(S.params,p);guardar()},
};

/* ---------- capa de datos: nube (Supabase) ---------- */
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args||{});if(error)throw error;return data}
async function tras(){await recargar();avisarOtros()}
const N={
  async anotar(tid,con){const id=await rpc('anotar',{p_casa:casaId,p_tarea:tid,p_con:con});await tras();return id},
  async votar(id,tipo,motivo){await rpc('votar',{p_registro:id,p_tipo:tipo,p_motivo:motivo||null});await tras()},
  async retirarVoto(id){await rpc('retirar_voto',{p_registro:id});await tras()},
  async anular(id,flag){await rpc('anular',{p_registro:id,p_anular:flag});await tras()},
  async compartir(id,con){await rpc('compartir',{p_registro:id,p_con:con});await tras()},
  async guardarPeriodo(o){const id=await rpc('guardar_periodo',{p_casa:casaId,p_id:o.id||null,p_inicio:iso(o.inicio),p_fin:iso(o.fin),p_premio:o.premio||''});await tras();return id},
  async cerrarPeriodo(id,flag){await rpc('cerrar_periodo',{p_casa:casaId,p_id:id,p_cerrado:flag});await tras()},
  async guardarMiembro(o){const id=await rpc('guardar_miembro',{p_casa:casaId,p_id:o.id||null,p_nombre:o.nombre??null,p_email:o.email??null,p_admin:o.admin??null,p_activo:o.activo??null});await tras();return id},
  async guardarTarea(id,d){const r=await rpc('guardar_tarea',{p_casa:casaId,p_id:id||null,p_datos:d});await tras();return r},
  async importarTareas(lista){const r=await rpc('importar_tareas',{p_casa:casaId,p_lista:lista});await tras();return r},
  async guardarReglas(p){await rpc('guardar_reglas',{p_casa:casaId,p_params:p});await tras()},
};
const api=()=>modo==='nube'?N:L;

function aplicar(d){
  const ms=x=>Date.parse(x);
  S={nube:true,casa:{id:d.casa.id,nombre:d.casa.nombre},params:{...PARAMS,...d.casa.params},yo:d.yo,skew:ms(d.servidor)-Date.now(),
    miembros:d.miembros.map(m=>({id:m.id,nombre:m.nombre,admin:m.admin,borrado:!m.activo,email:m.email,unido:m.unido})),
    tareas:d.tareas.map(t=>({id:t.id,cat:t.cat,nombre:t.nombre,c:t.c,t:t.t,m:t.m,ajuste:t.ajuste==null?null:+t.ajuste,activa:t.activa,borrado:false})),
    periodos:d.periodos.map(p=>({id:p.id,inicio:ms(p.inicio),fin:ms(p.fin),premio:p.premio,cerrado:p.cerrado,borrado:false})),
    registros:d.registros.map(r=>({id:r.id,tareaId:r.tareaId,nombre:r.nombre,cat:r.cat,puntos:+r.puntos,autor:r.autor,participantes:r.participantes,validadores:r.validadores,
      plazoH:+r.plazoH,quorum:+r.quorum,fecha:ms(r.fecha),periodoId:r.periodoId,borrado:false,
      votos:Object.fromEntries(Object.entries(r.votos||{}).map(([k,v])=>[k,{tipo:v.tipo,motivo:v.motivo,fecha:ms(v.fecha)}]))}))};
}
async function recargar(){if(modo!=='nube'||!casaId)return;const d=await rpc('estado_casa',{p_casa:casaId,p_extra:ui.panelPer||null});aplicar(d);offline=false}
let tSync=null;
async function sincronizar(){if(modo!=='nube'||!casaId)return;try{await recargar();refrescar()}catch(e){if(esRed(e)&&!offline){offline=true;refrescar()}}}
function conectarCanal(){if(!sb||!casaId)return;try{if(canal)sb.removeChannel(canal);
  canal=sb.channel('porfin-'+casaId,{config:{broadcast:{self:false}}}).on('broadcast',{event:'cambio'},()=>{clearTimeout(tSync);tSync=setTimeout(sincronizar,400)}).subscribe()}catch(e){console.warn(e)}}
function avisarOtros(){try{canal&&canal.send({type:'broadcast',event:'cambio',payload:{}})}catch(e){}}

async function entrarNube(){
  modo='nube';prefs.modo='nube';guardarPrefs();S=null;ui.cargando=true;ui.errorCarga=null;render();
  try{casas=await rpc('unirme');
    if(!casas.length){ui.cargando=false;render();return}
    casaId=(casas.find(c=>c.id===prefs.casa)||casas[0]).id;prefs.casa=casaId;guardarPrefs();
    await recargar();conectarCanal();ui.cargando=false;view='inicio';render();

async function salirNube(){try{if(canal)sb.removeChannel(canal)}catch(e){}canal=null;try{await sb.auth.signOut()}catch(e){}
  sesion=null;S=null;casaId=null;casas=[];modo=null;prefs.modo=null;guardarPrefs();view='inicio';render()}

/* ---------- avisos y errores ---------- */
let tToast=null;
function aviso(msg,deshacer){const el=$('#toast');clearTimeout(tToast);
  el.innerHTML=`<div class="toast"><span>${esc(msg)}</span>${deshacer?'<button type="button" id="undo">Deshacer</button>':''}</div>`;
  if(deshacer)$('#undo').onclick=()=>{el.innerHTML='';deshacer()};
  tToast=setTimeout(()=>el.innerHTML='',deshacer?6000:4500)}
const esRed=e=>/Failed to fetch|NetworkError|Load failed|network|fetch/i.test((e&&e.message)||'');
function msgError(e){const m=(e&&(e.message||e.error_description||e.msg))||'';
  if(esRed(e))return'No hay conexión con el servidor. Revisa internet e inténtalo de nuevo.';
  if(/JWT|not authenticated|Tienes que entrar/i.test(m))return'Tu sesión ha caducado. Vuelve a entrar con tu email.';
  if(/rate limit|too many|security purposes/i.test(m))return'Has pedido varios códigos seguidos. Espera un minuto y vuelve a intentarlo.';
  if(/expired|invalid.*(otp|token)|Token has expired/i.test(m))return'El código no es correcto o ha caducado. Revísalo o pide otro.';
  return m||'Algo ha fallado. Inténtalo de nuevo.'}
let ocupado=false;
async function hacer(fn,ok,undo){if(ocupado)return;ocupado=true;document.body.classList.add('ocupado');
  try{const res=await fn();render();if(ok)aviso(typeof ok==='function'?ok(res):ok,undo?(()=>hacer(()=>undo(res),'Hecho: se ha deshecho el cambio')):null);return res}
  catch(e){console.error(e);aviso(msgError(e));if(modo==='nube')sincronizar()}
  finally{ocupado=false;document.body.classList.remove('ocupado')}}

function render(){
  const app=$('#app'),dock=$('#dock');aplicarTema();
  const abiertos=[...document.querySelectorAll('details[data-k][open]')].map(d=>d.dataset.k);
  ui.sucio=false;
  if(modo==='nube'&&!S){dock.hidden=true;app.innerHTML=ui.cargando?vCargando():ui.errorCarga?vErrorCarga():vSinCasa();restaurar(abiertos);return}
  if(!modo||!S){dock.hidden=true;app.innerHTML=ui.login?vLogin():ui.onb?vOnb():vPortada();return}
  app.innerHTML=({inicio:vInicio,anotar:vAnotar,panel:vPanel,ajustes:vAjustes})[view]();
  restaurar(abiertos);
  dock.hidden=false;
  dock.innerHTML=`<div class="dock-in">${view==='inicio'?'<button type="button" class="b-prin" data-act="ir" data-v="anotar">＋ Anotar tarea</button>':view==='anotar'?'<button type="button" class="b-sec" data-act="ir" data-v="inicio">Volver sin anotar</button>':''}
  <nav aria-label="Secciones">${[['inicio','🏠','Inicio'],['panel','🏆','Panel'],['ajustes','⚙️','Ajustes']].map(([v,i,l])=>`<button type="button" data-act="ir" data-v="${v}" ${view===v||(view==='anotar'&&v==='inicio')?'aria-current="page"':''}><span class="ico" aria-hidden="true">${i}</span>${l}</button>`).join('')}</nav></div>`;
  if(view==='anotar')pintarTareas();
}
function restaurar(k){for(const x of k){const d=document.querySelector(`details[data-k="${x}"]`);if(d)d.open=true}}
function refrescar(){const a=document.activeElement;if(ui.rech||ui.editT||ui.share||ui.imp||(a&&a.matches&&a.matches('input,select,textarea'))){ui.sucio=true;return}render()}

function cabecera(){const per=periodoActual();
  return `<div class="cab"><div><h1>${esc(S.casa.nombre)}</h1><p class="suave">${per?`Periodo: ${fDia(per.inicio)} – ${fDia(per.fin)}`:'Sin periodo en marcha'} · Estás como <b>${esc(yo().nombre)}</b>${esAdmin()?' (admin)':''}</p></div></div>
  ${offline?'<div class="aviso-banda" role="status"><strong>Sin conexión.</strong> Lo que ves puede no estar al día. Se actualizará solo al recuperar internet.</div>':''}
  ${S.demo?`<p class="suave" style="color:var(--aviso)">Modo demo${S.demo.offset?` · reloj adelantado ${dur(S.demo.offset)}`:''}. Cambia de persona en Ajustes.</p>`:''}`}

function vInicio(){
  const per=periodoActual(),t=now();
  if(!per)return cabecera()+`<div class="vacio tarjeta"><span class="ico" aria-hidden="true">📅</span><p>No hay ningún periodo en marcha.</p>${esAdmin()?'<button type="button" class="b-sec" data-act="ir" data-v="ajustes">Crear periodo y premio</button>':'<p>Pide al administrador que cree uno.</p>'}</div>`;
  const tabla=calc(per),mio=tabla.find(x=>x.id===S.yo)||{pts:0,pos:'-'},lider=tabla[0];
  const regs=vivos(S.registros).filter(r=>r.periodoId===per.id);
  const porValidar=regs.filter(r=>r.validadores.includes(S.yo)&&!r.votos[S.yo]&&t<cuenta(r).vence).sort((a,b)=>a.fecha-b.fecha);
  const mias=regs.filter(r=>parts(r).includes(S.yo)&&estado(r)==='pendiente');
  const ultimos=regs.slice().sort((a,b)=>b.fecha-a.fecha).slice(0,6);
  const terminado=t>per.fin, provisional=regs.some(r=>estado(r)==='pendiente');

  ${terminado?`<div class="aviso-banda" role="status"><strong>${provisional?'Resultado provisional':'Periodo terminado'}:</strong> ${ganadores.length>1?'empate entre '+ganadores.map(g=>esc(miembro(g.id).nombre)).join(' y '):'gana '+esc(miembro(lider.id).nombre)} con ${fmt(lider.pts)} puntos.${provisional?' Aún hay tareas esperando validación.':''} ${esAdmin()?'<button type="button" class="b-texto" data-act="ir" data-v="ajustes">Empezar nuevo periodo</button>':''}</div>`:''}
  <div class="tarjeta">
    <div class="marcador"><span class="cifra">${fmt(mio.pts)}</span><div><b>tus puntos</b><p class="suave">${ord(mio.pos)} de ${tabla.length}${lider&&lider.id!==S.yo?` · el líder (${esc(miembro(lider.id).nombre)}) tiene ${fmt(lider.pts)}`:mio.pos===1?' · vas en cabeza':''}</p></div></div>
    <div class="premio"><span aria-hidden="true">🏆</span><p><span class="suave">Premio del periodo</span><br><b>${esc(per.premio||'Sin premio definido')}</b> <span class="suave">· ${terminado?'terminado':'quedan '+dur(per.fin-t)}</span></p></div>
  </div>
  <section aria-labelledby="h-val"><div class="entre"><h2 id="h-val">Te toca validar</h2><span class="suave num">${porValidar.length}</span></div>
  ${porValidar.length?`<ul class="lista">${porValidar.map(itemValidar).join('')}</ul>`:'<div class="vacio tarjeta"><span class="ico" aria-hidden="true">✅</span><p>Estás al día. No tienes nada pendiente de validar.</p></div>'}
  <p class="suave">Si no respondes en ${fmt(P().plazoH)} h pierdes ${fmt(P().sancion)} puntos. Responder suma ${fmt(P().bonus)}.</p></section>
  <section aria-labelledby="h-mias"><h2 id="h-mias">Tus tareas esperando</h2>
  ${mias.length?`<ul class="lista">${mias.map(r=>{const c=cuenta(r),otros=parts(r).filter(i=>i!==S.yo),libre=r.autor===S.yo&&!Object.keys(r.votos).length;return`<li class="item"><div class="entre"><span><span class="t">${esc(r.nombre)}</span>${otros.length?` <span class="suave">· con ${esc(nombres(otros))}</span>`:''}</span><span class="pts">${ptsTxt(r)}</span></div>
   <div class="barra" aria-hidden="true"><i style="width:${Math.min(100,c.ok/c.need*100)}%"></i></div>

}
function itemValidar(r){const c=cuenta(r),t=now(),e=estado(r),abierto=ui.rech===r.id;
  return `<li class="item"><div class="entre"><span><span class="t">${esc(nombres(parts(r)))}</span> · ${esc(r.nombre)}</span><span class="pts">${ptsTxt(r)}</span></div>

function pintarTareas(){const el=$('#lista-tareas');if(!el)return;const q=norm(ui.q);

function vPanel(){
  const pers=vivos(S.periodos).slice().sort((a,b)=>b.inicio-a.inicio);if(!pers.length)return'<h1>Panel</h1><div class="vacio tarjeta"><p>Todavía no hay periodos.</p></div>';
  const per=pers.find(p=>p.id===ui.panelPer)||periodoActual()||pers[0],tabla=calc(per),max=Math.max(1,...tabla.map(x=>Math.abs(x.pts)));
  const regs=vivos(S.registros).filter(r=>r.periodoId===per.id).sort((a,b)=>b.fecha-a.fecha);
  const causas={};regs.forEach(r=>{for(const v in r.votos){const x=r.votos[v];if(x.tipo==='no'&&x.fecha<=cuenta(r).vence)causas[x.motivo]=(causas[x.motivo]||0)+1}});
  const totC=Object.values(causas).reduce((a,b)=>a+b,0);
  return `<div><h1>Panel</h1><p class="suave">Puntos = tareas aprobadas (repartidas a partes iguales si son compartidas) + ${fmt(P().bonus)} por cada respuesta − ${fmt(P().sancion)} por cada tarea sin responder.</p></div>
  <label for="selPer">Periodo<select id="selPer" data-change="per">${pers.map(p=>`<option value="${p.id}" ${p.id===per.id?'selected':''}>${fDia(p.inicio)} – ${fDia(p.fin)}${p.cerrado?' (cerrado)':''}</option>`).join('')}</select></label>
  <div class="premio"><span aria-hidden="true">🏆</span><p><span class="suave">Premio</span><br><b>${esc(per.premio||'Sin premio')}</b></p></div>
  <section aria-labelledby="h-clas"><h2 id="h-clas">Clasificación</h2><ul class="lista">${tabla.map(x=>`<li class="item">
    <div class="entre"><div class="fila"><span class="ranking-pos" aria-label="Posición ${x.pos}">${x.pos}</span><span class="t">${esc(miembro(x.id).nombre)}${x.id===S.yo?' (tú)':''}</span></div><span class="cifra" style="font-size:28px">${fmt(x.pts)}</span></div>
    <div class="barra" aria-hidden="true"><i style="width:${Math.max(0,x.pts)/max*100}%"></i></div>
    <details data-k="det-${x.id}"><summary>Ver detalle</summary><div class="cuerpo"><dl class="desglose">
      <dt>Tareas aprobadas</dt><dd>${x.aprob} · <span class="pos">${signo(x.ptsT)}</span></dd>
      <dt>· de ellas, compartidas</dt><dd>${x.compartidas}</dd>
      <dt>Respuestas a tiempo</dt><dd>${x.valid} · <span class="pos">${signo(x.valid*P().bonus)}</span></dd>
      <dt>Sin responder</dt><dd>${x.sanc} · <span class="neg">${signo(-x.sanc*P().sancion)}</span></dd>
      <dt>Tareas rechazadas</dt><dd>${x.rechazadas}</dd>
      <dt>Votos de rechazo recibidos</dt><dd>${x.votosNo}</dd>
      ${Object.entries(x.causas).map(([k,v])=>`<dt>· ${esc(k)}</dt><dd>${v}</dd>`).join('')}
      <dt>Rechazos que ha emitido</dt><dd>${x.rechEmit}</dd>
      <dt>Tareas suyas esperando</dt><dd>${x.pend}</dd>
      <dt>Le quedan por validar</dt><dd>${x.porValidar}</dd>
    </dl></div></details></li>`).join('')}</ul></section>
  <section aria-labelledby="h-causas"><h2 id="h-causas">Causas de rechazo</h2>
  ${totC?`<ul class="lista">${Object.entries(causas).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<li class="item"><div class="entre"><span>${esc(k)}</span><span class="pts">${v}</span></div><div class="barra" aria-hidden="true"><i style="width:${v/totC*100}%;background:var(--error)"></i></div></li>`).join('')}</ul>`:'<p class="suave">Ningún rechazo en este periodo.</p>'}</section>
  <details data-k="todas"><summary>Todas las tareas del periodo (${regs.length})</summary><div class="cuerpo"><ul class="lista">${regs.map(r=>{const c=cuenta(r);return`<li class="item" style="background:var(--fondo)"><div class="entre"><span><span class="t">${esc(nombres(parts(r)))}</span> · ${esc(r.nombre)}</span><span class="pts">${ptsTxt(r)}</span></div>
  <div class="entre"><span class="suave">${fHora(r.fecha)} · ✓${c.ok} ✕${c.no}</span>${chip(estado(r))}</div>
  ${r.validadores.filter(v=>!r.votos[v]&&now()>=c.vence).length?`<p class="suave neg">Sin responder: ${r.validadores.filter(v=>!r.votos[v]).map(v=>esc(miembro(v).nombre)).join(', ')}</p>`:''}
  ${Object.entries(r.votos).filter(([,v])=>v.tipo==='no').map(([k,v])=>`<p class="suave">✕ ${esc(miembro(k).nombre)}: ${esc(v.motivo)}</p>`).join('')}</li>`}).join('')||'<li class="suave">Sin tareas.</li>'}</ul></div></details>`;
}

  :`<h1>Revisa tu correo</h1><p>Hemos enviado un código a <b>${esc(l.email)}</b>. Escríbelo aquí. Si no aparece en un par de minutos, mira en la carpeta de spam.</p>

   ${l.error?`<p class="error-txt" role="alert">${esc(l.error)}</p>`:''}<button type="submit" class="b-prin" ${l.enviando?'disabled':''}>${l.enviando?'Comprobando…':'Entrar'}</button></form>
   <button type="button" class="b-texto" data-act="loginEmail">Cambiar de email o pedir otro código</button>`}
  <button type="button" class="b-texto" data-act="portada">Volver</button></div>`}
function vCargando(){return `<div class="vacio" style="padding-top:64px"><span class="ico" aria-hidden="true">⏳</span><p>Cargando tu casa…</p></div>`}
function vErrorCarga(){return `<div class="portada"><h1>No se ha podido cargar</h1><p class="error-txt">${esc(ui.errorCarga)}</p><button type="button" class="b-prin" data-act="reintentar">Reintentar</button><button type="button" class="b-texto" data-act="salir">Cerrar sesión</button></div>`}
function vSinCasa(){const email=sesion&&sesion.user&&sesion.user.email||'';
  return `<div class="portada"><h1>Ya has entrado</h1><p>Has entrado como <b>${esc(email)}</b>, pero todavía no perteneces a ninguna casa.</p>
  <div class="tarjeta"><h2>¿Te ha invitado alguien?</h2><p>Pide a quien administra la casa que añada este email en <b>Ajustes → Miembros</b>. Después pulsa:</p><button type="button" class="b-sec" data-act="reintentar">Volver a comprobar</button></div>
  <details data-k="crear"><summary>Crear una casa nueva (si eres quien organiza)</summary><div class="cuerpo">
   <label for="cCasa">Nombre de la casa<input id="cCasa" maxlength="60" placeholder="Ej.: Casa Muñoz"></label>
   <label for="cYo">Tu nombre o alias<input id="cYo" maxlength="40"></label>
   <label for="cPremio">Premio de esta semana<input id="cPremio" maxlength="120" placeholder="Ej.: elegir la peli del sábado"></label>
   ${ui.msg?`<p class="error-txt">${esc(ui.msg)}</p>`:''}
   <button type="button" class="b-prin" data-act="crearCasa">Crear casa y empezar la semana</button>
   <p class="suave">Se crea con el catálogo de 31 tareas, que luego puedes cambiar o importar desde Excel.</p></div></details>
  <button type="button" class="b-texto" data-act="salir">Cerrar sesión</button></div>`}
function vOnb(){return `<div class="portada"><h1>Configura tu casa</h1><p class="suave">Tres datos y listo. Todo se puede cambiar después en Ajustes.</p>
  <label for="oCasa">Nombre de la casa<input id="oCasa" placeholder="Ej.: Casa Muñoz" value="Mi casa"></label>
  <fieldset class="motivos"><legend>¿Quiénes jugáis? (el primero será el administrador)</legend><div class="rejilla">${[0,1,2,3].map(i=>`<label for="oM${i}">Miembro ${i+1}<input id="oM${i}" placeholder="${['Tu nombre','Nombre','Nombre','Nombre'][i]}"></label>`).join('')}</div></fieldset>
  <label for="oPremio">Premio de esta semana<input id="oPremio" placeholder="Ej.: elegir la peli del sábado"></label>
  ${ui.msg?`<p class="error-txt">${esc(ui.msg)}</p>`:''}

  <button type="button" class="b-texto" data-act="portada">Volver</button></div>`}

/* ---------- utilidades de eventos ---------- */
function rango(tipo){const t=now(),d=new Date(t);if(tipo==='semana'){const dw=(d.getDay()+6)%7;const ini=inicioDia(t-dw*D);return[ini,finDia(ini+6*D)]}return[inicioDia(new Date(d.getFullYear(),d.getMonth(),1)),finDia(new Date(d.getFullYear(),d.getMonth()+1,0))]}
function descargar(nombre,texto){const b=new Blob([texto],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function cargarXLSX(){return new Promise((ok,ko)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>ko(new Error('No se ha podido cargar el lector de Excel. Revisa la conexión e inténtalo de nuevo.'));document.head.appendChild(s)})}
async function leerExcel(buf){await cargarXLSX();
  const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets['Tareas']||wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  const hi=rows.findIndex(r=>r.some(c=>norm(c)==='tarea'));if(hi<0)throw new Error('No he podido leer el Excel: no encuentro una columna llamada «Tarea».');
  const h=rows[hi].map(norm),col=k=>h.findIndex(x=>x.startsWith(k)),cT=col('tarea'),cC=col('categor'),cX=col('complejidad'),cTi=col('tiempo'),cM=col('molestia'),cA=col('ajuste'),cV=col('activa');
  if([cX,cTi,cM].includes(-1))throw new Error('No he podido leer el Excel: faltan las columnas de Complejidad, Tiempo o Molestia.');
  const cl=v=>Math.min(3,Math.max(1,Math.round(+v)||1)),lista=[];
  for(const r of rows.slice(hi+1)){const n=String(r[cT]||'').trim();if(!n)continue;
    lista.push({nombre:n,cat:cC>=0&&r[cC]?String(r[cC]).trim():'Otras',c:cl(r[cX]),t:cl(r[cTi]),m:cl(r[cM]),ajuste:cA>=0&&r[cA]!==''&&!isNaN(+r[cA])?+r[cA]:null,activa:cV>=0?norm(r[cV])!=='no':true})}
  return lista}
function leerTareaForm(id){const g=k=>document.getElementById(k+'-'+id),aj=g('ej').value.trim();
  return{nombre:g('en').value.trim(),cat:g('eg').value.trim()||'Otras',c:+g('ec').value,t:+g('et').value,m:+g('em').value,ajuste:aj===''?null:+aj,activa:g('ea').checked}}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const d=b.dataset,a=d.act;
  switch(a){
  case'ir':view=d.v;ui.rech=null;ui.borrar=false;ui.con=[];ui.share=null;ui.editT=null;ui.nueva=null;render();window.scrollTo(0,0);break;
  case'irMiembros':view='ajustes';render();{const x=document.querySelector('details[data-k="miembros"]');if(x){x.open=true;x.scrollIntoView()}}break;
  /* portada y acceso */
  case'demo':seedDemo();modo='local';prefs.modo='local';guardarPrefs();guardar();ui.onb=false;view='inicio';render();aviso('Familia de ejemplo cargada. Estás como Ana, la administradora.');break;
  case'onb':ui.onb=true;ui.msg=null;render();break;
  case'portada':ui.onb=false;ui.login=null;render();break;
  case'seguirLocal':S=leer(KEY);modo='local';prefs.modo='local';guardarPrefs();view='inicio';render();break;
  case'salirLocal':modo=null;S=null;prefs.modo=null;guardarPrefs();render();break;
  case'login':ui.login={paso:'email',email:prefs.email||''};render();setTimeout(()=>{const i=$('#lEmail');i&&i.focus()},50);break;
  case'loginEmail':ui.login={paso:'email',email:ui.login.email};render();break;
  case'reintentar':entrarNube();break;
  case'salir':salirNube();break;
  case'crearLocal':{const ns=[0,1,2,3].map(i=>$('#oM'+i).value.trim()).filter(Boolean);if(ns.length<2){ui.msg='Escribe al menos dos nombres para poder jugar.';render();return}
    S=base($('#oCasa').value.trim()||'Mi casa');S.miembros=ns.map((n,i)=>mk({nombre:n,admin:i===0}));S.yo=S.miembros[0].id;
    const[ini,fin]=rango('semana');S.periodos=[mk({inicio:ini,fin,premio:$('#oPremio').value.trim(),cerrado:false})];modo='local';prefs.modo='local';guardarPrefs();ui.onb=false;ui.msg=null;view='inicio';guardar();render();aviso('¡Casa lista! Anota la primera tarea.');break}
  case'crearCasa':{const nombre=$('#cCasa').value.trim(),mi=$('#cYo').value.trim(),premio=$('#cPremio').value.trim();
    if(!nombre||!mi){ui.msg='Escribe el nombre de la casa y tu nombre.';render();return}ui.msg=null;
    const t=Date.now(),dw=(new Date(t).getDay()+6)%7,ini=inicioDia(t-dw*D),fin=finDia(ini+6*D);
    hacer(async()=>{await rpc('crear_casa',{p_nombre:nombre,p_mi_nombre:mi,p_premio:premio,p_inicio:iso(ini),p_fin:iso(fin),p_tareas:CATALOGO_OBJ()});await entrarNube()},'¡Casa creada! Ahora añade a tu familia en Ajustes → Miembros.');break}
  /* juego */
  case'anotar':{const ta=S.tareas.find(x=>x.id===d.id),con=ui.con.slice();
    hacer(async()=>{const id=await api().anotar(d.id,con);ui.con=[];ui.q='';view='inicio';window.scrollTo(0,0);return id},
      ()=>con.length?`Anotada con ${nombres(con)}: ${ta.nombre} · ${fmt(ptsTarea(ta)/(con.length+1))} pts cada uno si se valida`:`Anotada: ${ta.nombre} · ${ptsTarea(ta)} pts si se valida`,
      id=>api().anular(id,true));break}
  case'cat':ui.cat=d.c;document.querySelectorAll('.chip[data-act=cat]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.c===ui.cat));pintarTareas();break;
  case'con':{const i=ui.con.indexOf(d.id);if(i>=0)ui.con.splice(i,1);else ui.con.push(d.id);render();break}
  case'validar':hacer(()=>api().votar(d.id,'ok'),`Validada · +${fmt(P().bonus)} pt por responder`,()=>api().retirarVoto(d.id));break;
  case'rech':ui.rech=d.id;ui.rechErr=false;render();break;
  case'cancRech':ui.rech=null;render();break;
  case'confRech':{const m=document.querySelector(`input[name="mot-${d.id}"]:checked`);if(!m){ui.rechErr=true;render();return}ui.rechErr=false;ui.rech=null;
    hacer(()=>api().votar(d.id,'no',m.value),`Rechazada (${m.value}) · +${fmt(P().bonus)} pt por responder`,()=>api().retirarVoto(d.id));break}
  case'anular':hacer(()=>api().anular(d.id,true),'Tarea anulada',()=>api().anular(d.id,false));break;
  case'share':ui.share=ui.share===d.id?null:d.id;render();break;
  case'shareFin':ui.share=null;render();break;
  case'shareTog':{const r=reg(d.r);let con=parts(r).filter(i=>i!==r.autor);if(con.includes(d.id))con=con.filter(x=>x!==d.id);else con.push(d.id);
    if(!con.includes(d.id)||quedaValidador(con))hacer(()=>api().compartir(d.r,con),()=>con.length?`Compartida con ${nombres(con)} · ${fmt(r.puntos/(con.length+1))} pts cada uno`:'Ya no es compartida');
    else aviso('Tiene que quedar al menos una persona para validar.');break}
  /* demo */
  case'reloj':S.demo.offset+=6*H;guardar();render();aviso('Reloj adelantado 6 horas. Mira cómo vencen los plazos.');break;
  case'relojReal':S.demo.offset=0;guardar();render();break;
  /* administración */
  case'preset':{const[i,f]=rango(d.p);$('#pIni').value=aInput(i);$('#pFin').value=aInput(f);break}
  case'guardarPer':{const i=$('#pIni').value,f=$('#pFin').value;if(!i||!f||deInput(f)<deInput(i)){aviso('Revisa las fechas: el final no puede ser anterior al inicio.');return}
    const per=periodoActual();hacer(()=>api().guardarPeriodo({id:per&&per.id,inicio:inicioDia(deInput(i)),fin:finDia(deInput(f)),premio:$('#pPremio').value.trim()}),'Periodo guardado');break}
  case'nuevoPer':{const per=periodoActual(),len=per.fin-per.inicio,ini=inicioDia(now());
    hacer(async()=>{await api().cerrarPeriodo(per.id,true);await api().guardarPeriodo({inicio:ini,fin:finDia(ini+len),premio:per.premio})},'Nuevo periodo en marcha. Revisa el premio.');break}
  case'addM':{const n=$('#nuevoM').value.trim(),em=$('#nuevoE')?$('#nuevoE').value.trim().toLowerCase():null;
    if(!n){aviso('Escribe un nombre para añadir al miembro.');return}if(S.nube&&!emailOk(em||'')){aviso('Escribe el email con el que entrará en la app.');return}
    hacer(()=>api().guardarMiembro({nombre:n,email:em}),S.nube?`${n} añadido. Envíale el enlace de la app para que entre con ${em}.`:`${n} se ha unido a la casa`);break}
  case'guardarM':{const m=S.miembros.find(x=>x.id===d.id),n=$('#mn-'+d.id).value.trim(),ad=$('#ma-'+d.id).checked,ei=$('#me-'+d.id),em=ei?ei.value.trim().toLowerCase():null;
    if(!ad&&m.admin&&vivos(S.miembros).filter(x=>x.admin).length===1){aviso('Tiene que haber al menos un administrador.');return}
    if(ei&&!emailOk(em)){aviso('Revisa el email: no parece válido.');return}
    hacer(()=>api().guardarMiembro({id:m.id,nombre:n||m.nombre,admin:ad,email:em}),'Miembro guardado');break}
  case'quitarM':{const m=S.miembros.find(x=>x.id===d.id);if(m.id===S.yo){aviso('No puedes quitarte a ti mismo.');return}
    if(m.admin&&vivos(S.miembros).filter(x=>x.admin).length===1){aviso('Es el único administrador. Nombra a otro antes de quitarlo.');return}
    hacer(()=>api().guardarMiembro({id:m.id,activo:false}),`${m.nombre} ya no participa`,()=>api().guardarMiembro({id:m.id,activo:true}));break}
  case'nuevaTarea':{if(!esAdmin())return;ui.nueva={id:'nueva',nombre:ui.q.trim(),cat:ui.cat!=='Todas'?ui.cat:'Otras',c:1,t:1,m:1,ajuste:null,activa:true};ui.editT='nueva';view='ajustes';render();
    setTimeout(()=>{const x=document.getElementById('en-nueva');if(x){x.scrollIntoView({block:'center'});x.focus()}},50);break}
  case'editT':ui.editT=d.id;ui.nueva=null;render();break;
  case'cancT':ui.editT=null;ui.nueva=null;render();break;
  case'guardarT':{const datos=leerTareaForm(d.id);if(!datos.nombre){aviso('La tarea necesita un nombre.');return}
    hacer(async()=>{await api().guardarTarea(d.id==='nueva'?null:d.id,datos);ui.editT=null;ui.nueva=null},()=>`«${datos.nombre}» guardada · ${ptsTarea(datos)} pts`);break}
  case'quitarT':{const t=S.tareas.find(x=>x.id===d.id);hacer(async()=>{await api().guardarTarea(t.id,{borrado:true});ui.editT=null},`«${t.nombre}» quitada del catálogo`,()=>api().guardarTarea(t.id,{borrado:false}));break}
  case'guardarReglas':{const v=k=>parseFloat($('#r-'+k).value),p={};for(const k of['pC','pT','pM','mult','bonus','sancion','plazoH']){const x=v(k);if(isNaN(x)||x<0){aviso('Revisa los números: no pueden estar vacíos ni ser negativos.');return}p[k]=x}
    p.plazoH=Math.max(1,p.plazoH);p.quorum=parseFloat($('#r-quorum').value);hacer(()=>api().guardarReglas(p),'Reglas guardadas');break}
  case'copiarEnlace':navigator.clipboard.writeText(urlApp()).then(()=>aviso('Enlace copiado. Pégalo en WhatsApp.'),()=>aviso('Tu navegador no permite copiar. Mantén pulsado el enlace para copiarlo.'));break;
  case'sync':hacer(()=>recargar(),'Datos actualizados');break;
  /* copias y apariencia */
  case'exportar':descargar(`porfin-copia-${aInput(Date.now())}.json`,JSON.stringify(S,null,2));aviso('Copia descargada');break;
  case'copiar':navigator.clipboard.writeText(JSON.stringify(S)).then(()=>aviso('Copia copiada al portapapeles'),()=>aviso('Tu navegador no permite copiar. Usa «Descargar copia».'));break;
  case'importar':$('#fJson').click();break;
  case'confImp':S=ui.imp;ui.imp=null;view='inicio';guardar();render();aviso('Copia cargada');break;
  case'cancImp':ui.imp=null;render();break;
  case'xls':$('#fXls').click();break;
  case'tema':prefs.tema=d.t;guardarPrefs();render();break;
  case'borrar':ui.borrar=true;render();break;
  case'noBorrar':ui.borrar=false;render();break;
  case'borrarYa':escribir(KEY,null);S=null;modo=null;prefs.modo=null;guardarPrefs();ui.borrar=false;view='inicio';render();aviso('Datos borrados');break;
  }});
document.addEventListener('submit',async e=>{e.preventDefault();const l=ui.login;if(!l||l.enviando)return;
  if(e.target.id==='fEmail'){const em=$('#lEmail').value.trim().toLowerCase();l.email=em;
    if(!emailOk(em)){l.error='Escribe un email válido, por ejemplo nombre@gmail.com.';render();return}
    l.enviando=true;l.error=null;render();
    try{const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});if(error)throw error;
      prefs.email=em;guardarPrefs();ui.login={paso:'codigo',email:em};render();setTimeout(()=>{const i=$('#lCodigo');i&&i.focus()},50)}
    catch(err){l.enviando=false;l.error=msgError(err);render()}}
  if(e.target.id==='fCodigo'){const code=$('#lCodigo').value.replace(/\D/g,'');
    if(code.length<6){l.error='El código tiene 6 cifras. Cópialo del correo.';render();return}
    l.enviando=true;l.error=null;render();
    try{const {data,error}=await sb.auth.verifyOtp({email:l.email,token:code,type:'email'});if(error)throw error;
      sesion=data.session;ui.login=null;await entrarNube()}
    catch(err){l.enviando=false;l.error=msgError(err);render()}}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;pintarTareas()}});
document.addEventListener('change',e=>{const k=e.target.dataset.change;if(!k)return;
  if(k==='yo'){S.yo=e.target.value;guardar();render();aviso(`Ahora estás como ${yo().nombre}`)}
  if(k==='per'){ui.panelPer=e.target.value;if(modo==='nube')hacer(()=>recargar());else render()}
  if(k==='casa'){prefs.casa=e.target.value;guardarPrefs();entrarNube()}
  if(k==='json'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.version!==1||!Array.isArray(o.miembros)||!Array.isArray(o.registros))throw 0;ui.imp=o;render()}catch(_){aviso('Ese archivo no es una copia de ¡Por Fin!. Elige el .json que descargaste desde Ajustes.')}};r.readAsText(e.target.files[0]);e.target.value=''}
  if(k==='xls'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';const r=new FileReader();
    r.onload=()=>hacer(async()=>api().importarTareas(await leerExcel(r.result)),x=>`Catálogo importado: ${x.actualizadas} tareas actualizadas y ${x.nuevas} nuevas.`);r.readAsArrayBuffer(f)}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(ui.sucio&&!(document.activeElement&&document.activeElement.matches('input,select,textarea')))refrescar()},300));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(modo==='nube')sincronizar();else if(S)refrescar()}});
window.addEventListener('online',()=>sincronizar());
setInterval(()=>{if(document.visibilityState!=='visible'||!S)return;if(modo==='nube')sincronizar();else if(view==='inicio')refrescar()},60000);
setInterval(()=>{if(S&&view==='inicio'&&document.visibilityState==='visible')refrescar()},30000);

/* ---------- arranque ---------- */
async function arrancar(){
  prefs=leer(KPREF)||{};aplicarTema();
  if(CFG.url&&CFG.key&&window.supabase){
    try{sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'porfin-sesion'}});
      sb.auth.onAuthStateChange((ev,s)=>{sesion=s;if(ev==='SIGNED_OUT'&&modo==='nube'){S=null;modo=null;render()}});
      const {data}=await sb.auth.getSession();sesion=data.session;
    }catch(e){console.error(e);sb=null}
  }
  if(sb&&sesion&&prefs.modo!=='local'){await entrarNube();return}
  if(prefs.modo==='local'){S=leer(KEY);if(S){modo='local'}}
  render();
}
arrancar();
